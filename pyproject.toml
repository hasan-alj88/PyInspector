[project]
name = "pyinspector"
version = "0.1.0"
description = "Python package inspection CLI tool using static AST analysis and isolated environments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
pyinspector = "pyinspector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

